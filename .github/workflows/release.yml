name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          version: 11.7.0
          runtime: node@22.23.2
          install: false

      - name: Verify release commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify release toolchain
        run: |
          test "$(node --version)" = "v22.23.2"
          test "$(pnpm --version)" = "11.7.0"
          test "$(pnpm exec tsc --version)" = "Version 6.0.3"
          test "$(pnpm exec esbuild --version)" = "0.28.2"

      - name: Verify project and release assets
        run: pnpm check

      - name: Verify tag matches Core version
        run: node scripts/verify-release-tag.mjs "$GITHUB_REF_NAME"

      - name: Create draft GitHub Release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/core-artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "LabourChain Core Protocols $GITHUB_REF_NAME"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
